<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta | Meu Controle Financeiro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body class="pagina-autenticacao">
    <main class="area-autenticacao">
      <section id="cadastro-container" class="container-autenticacao">
        <div class="icone-autenticacao">💚</div>

        <h1>Meu Controle Financeiro</h1>
        <p class="subtitulo-autenticacao">Crie sua conta para começar.</p>

        <form id="form-cadastro">
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Mínimo de 8 caracteres"
              minlength="8"
              required
            />
          </div>

          <div class="campo">
            <label for="confirmar-senha">Confirmar senha</label>
            <input
              type="password"
              id="confirmar-senha"
              placeholder="Digite a senha novamente"
              required
            />
          </div>

          <button type="submit" id="btn-cadastrar">Criar minha conta</button>

          <p id="mensagem"></p>
        </form>

        <p class="rodape-autenticacao">
          Já tem uma conta?
          <a href="/">Voltar ao início</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/cadastro.js"></script>
  </body>
</html>
